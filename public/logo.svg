<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Royal to Navy Blue Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Subtle Glass Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Monogram Drop Shadow -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10.24" stdDeviation="12.8" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Square Background -->
  <rect width="512" height="512" rx="113" fill="url(#logoBgGrad)" />

  <!-- Inner Highlight Bevel (for standard icons) -->
  
  <rect x="5" y="5" width="502" height="502" rx="113" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="10" />
  <rect width="512" height="246" rx="113" fill="url(#sheenGrad)" clip-path="url(#sheenClip)" />
  

  <!-- Signature Bold "SH" Monogram -->
  <text
    x="256"
    y="276.48"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="266"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-0.04em"
    filter="url(#monogramShadow)"
  >SH</text>
</svg>